<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>✏️ [국어] 표준 발음과 받침 형성 평가</title>
  <style>
    :root {
      --primary: #1E3A8A;
      --primary-light: #EFF6FF;
      --success: #15803D;
      --success-bg: #DCFCE7;
      --error: #B91C1C;
      --error-bg: #FEE2E2;
      --border: #CBD5E1;
      --text: #1E293B;
      --gray: #64748B;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background-color: #F8FAFC;
      color: var(--text);
      line-height: 1.6;
      padding: 20px 12px;
    }
    .container {
      max-width: 680px;
      margin: 0 auto;
      background: #FFFFFF;
      border-radius: 14px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
      padding: 24px 20px;
      border: 1px solid #E2E8F0;
    }
    h1 { font-size: 1.45rem; color: var(--primary); text-align: center; margin-bottom: 8px; font-weight: 800; }
    .subtitle { text-align: center; color: var(--gray); font-size: 0.92rem; margin-bottom: 22px; }
    .card {
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 18px;
    }
    .badge {
      display: inline-block;
      background: #E2E8F0;
      color: #334155;
      font-size: 0.8rem;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .q-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 14px; line-height: 1.5; }
    label { font-weight: 600; font-size: 0.95rem; display: block; margin-bottom: 6px; }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 11px 12px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 0.98rem;
      transition: border 0.2s;
    }
    input[type="text"]:focus, input[type="password"]:focus {
      outline: none;
      border-color: var(--primary);
    }
    .btn {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s;
    }
    .btn:hover { background: #172554; }
    .btn-secondary { background: #475569; }
    .btn-secondary:hover { background: #334155; }
    .btn-outline { background: white; color: var(--primary); border: 1.5px solid var(--primary); }
    .btn-outline:hover { background: var(--primary-light); }
    .radio-group { display: flex; flex-direction: column; gap: 8px; margin: 12px 0; }
    .radio-item {
      display: flex;
      align-items: flex-start;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      background: white;
      font-size: 0.95rem;
    }
    .radio-item:hover { background: var(--primary-light); }
    .radio-item input { margin-top: 4px; margin-right: 10px; cursor: pointer; }
    .progress-bar-bg {
      background: #E2E8F0;
      border-radius: 999px;
      height: 9px;
      overflow: hidden;
      margin: 10px 0 16px;
    }
    .progress-bar-fill {
      background: var(--primary);
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
    }
    .flex-between { display: flex; justify-content: space-between; font-size: 0.88rem; color: var(--gray); font-weight: 600; }
    .msg-box {
      padding: 14px;
      border-radius: 8px;
      margin-top: 14px;
      font-size: 0.95rem;
    }
    .msg-success { background: var(--success-bg); color: var(--success); border: 1px solid #86EFAC; font-weight: 700; }
    .msg-error { background: var(--error-bg); color: var(--error); border: 1px solid #FCA5A5; font-weight: 700; }
    .msg-info { background: #F0FDF4; color: #166534; border: 1px solid #BBF7D0; margin-top: 10px; line-height: 1.55; }
    .teacher-box {
      border: 1px dashed #94A3B8;
      border-radius: 8px;
      padding: 10px;
      background: #F1F5F9;
      margin-bottom: 14px;
      display: flex;
      gap: 8px;
    }
    .tabs { display: flex; border-bottom: 2px solid #E2E8F0; margin-bottom: 16px; gap: 6px; }
    .tab-btn {
      padding: 10px 14px;
      border: none;
      background: none;
      font-weight: 700;
      font-size: 0.92rem;
      cursor: pointer;
      color: var(--gray);
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
    }
    .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }
    details {
      background: white;
      border: 1px solid #E2E8F0;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 10px;
      font-size: 0.92rem;
    }
    summary { font-weight: 700; cursor: pointer; color: #1E3A8A; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="container">
  <h1>✏️ [국어] 표준 발음과 받침 형성 평가</h1>
  <div class="subtitle">교과서 핵심 원리 30문항 완전 정복</div>

  <!-- 1. 학생 정보 입력 화면 -->
  <div id="screen-intro">
    <div class="card">
      <h3 style="margin-bottom: 10px; color: var(--primary);">👤 감일고 학생 정보 입력</h3>
      <p style="font-size: 0.9rem; color: var(--gray); margin-bottom: 14px;">
        학번과 이름을 정확히 입력하세요. 잘못 기재하면 참여하지 않은 것으로 처리됩니다. (총 30문항)
      </p>
      <div style="margin-bottom: 12px;">
        <label for="s_id">학번 (예: 20101)</label>
        <input type="text" id="s_id" placeholder="학번을 입력하세요">
      </div>
      <div style="margin-bottom: 12px;">
        <label for="s_name">이름 (예: 홍길동)</label>
        <input type="text" id="s_name" placeholder="이름을 입력하세요">
      </div>
      <button class="btn" onclick="startQuiz()">🚀 평가 시작하기</button>
      <div id="intro-warn" class="msg-box msg-error hidden" style="margin-top: 10px;">⚠️ 학번과 이름을 모두 입력해 주세요!</div>
    </div>
  </div>

  <!-- 2. 개별 문제 풀이 화면 -->
  <div id="screen-quiz" class="hidden">
    <div class="flex-between">
      <span id="display-user"></span>
      <span id="display-progress"></span>
    </div>
    <div class="progress-bar-bg">
      <div id="progress-bar" class="progress-bar-fill"></div>
    </div>

    <!-- 1번 문제 전용: 교사 패스 -->
    <div id="teacher-quick-pass" class="teacher-box hidden">
      <input type="password" id="teacher-pw" placeholder="교사용 비밀번호" style="flex: 2; padding: 6px 10px; font-size: 0.85rem;">
      <button class="btn btn-secondary" onclick="checkTeacherJump()" style="flex: 1; margin: 0; padding: 6px; font-size: 0.85rem;">결과 직행</button>
    </div>

    <div class="card">
      <span id="q-category" class="badge"></span>
      <div id="q-question" class="q-title"></div>

      <!-- 단답형 입력창 -->
      <div id="box-short" class="hidden">
        <label for="short-input">정답 입력:</label>
        <input type="text" id="short-input" placeholder="답을 작성하세요..." onkeypress="handleEnter(event)">
      </div>

      <!-- 선택형 보기 -->
      <div id="box-choice" class="hidden">
        <div id="choice-options" class="radio-group"></div>
      </div>

      <button id="btn-check" class="btn" onclick="checkCurrentAnswer()">🔍 정답 확인 및 해설 보기</button>

      <!-- 피드백 & 해설창 -->
      <div id="feedback-result" class="hidden">
        <div id="msg-feedback" class="msg-box"></div>
        <div id="msg-explanation" class="msg-box msg-info"></div>
        <button id="btn-next" class="btn" onclick="goToNextQuestion()" style="margin-top: 12px;">➡️ 다음 문제로 이동</button>
      </div>
      <div id="lock-msg" class="hidden" style="text-align: center; color: var(--gray); font-size: 0.85rem; margin-top: 10px;">
        🔒 정답을 맞혀야 다음 문제로 넘어갈 수 있습니다.
      </div>
    </div>
  </div>

  <!-- 3. 최종 완료 화면 -->
  <div id="screen-result" class="hidden">
    <div style="text-align: center; margin-bottom: 20px;">
      <h2 style="color: var(--primary);" id="result-title">🎉 평가 완료!</h2>
      <h3 style="margin-top: 6px; font-size: 1.15rem;" id="result-score"></h3>
      <p style="font-size: 0.9rem; color: var(--gray); margin-top: 4px;">평가 결과는 <b>선생님 기록부에 자동 저장</b>되었습니다.</p>
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab(1)">📊 나의 결과 & 오답노트</button>
      <button class="tab-btn" onclick="switchTab(2)">📚 전체 30문항 다시 보기</button>
    </div>

    <div id="tab-content-1">
      <div id="wrong-summary-box" class="card"></div>
      <button id="btn-retry-wrong" class="btn btn-outline hidden" onclick="startRetryWrong()">🔥 처음 틀렸던 문제만 오답노트로 다시 풀기</button>
      <button class="btn btn-secondary" onclick="resetFullQuiz()" style="margin-top: 10px;">🔄 처음부터 전체 문제 다시 시작하기</button>
    </div>

    <div id="tab-content-2" class="hidden">
      <div style="font-size: 0.9rem; color: var(--gray); margin-bottom: 12px;">
        💡 전체 30개 문항을 자율적으로 복습하고, [정답 및 해설]을 열어 정답을 확인하세요.
      </div>
      <div id="all-questions-list"></div>
    </div>
  </div>
</div>

<script>
  // 🔗 [설정] 배포된 Google Apps Script URL & 비밀번호
  const GOOGLE_SHEET_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbymuGKCOqviCjqn3PEab4ubtf_m5cf1Gj184kGTgFqm0nBrOSKX7_oc9V_Wjv73AbGTAA/exec";
  const TEACHER_PASSWORD = "01063052122";

  // 📚 원본 30문항 데이터
  const RAW_QUIZ_DATA = {
    "1. 표준 발음의 개념과 원칙": [
      { id: 1, type: "short", question: "사람마다 발음하는 법이 달라서 [     ]에 지장이 생기는 것을 막기 위해 발음의 표준을 정해 놓은 것을 '표준 발음'이라고 합니다. 빈칸에 들어갈 알맞은 단어를 쓰시오. (띄어쓰기 없이 작성할 것)", answer: "의사소통", explanation: "표준 발음은 국어를 쓰는 사람들 사이에서 발음이 달라 의사소통에 지장이 생기는 것을 막기 위해 정한 약속입니다." },
      { id: 2, type: "short", question: "표준 발음은 '표준어의 실제 발음을 따르되, 국어의 전통성과 [     ]을 고려하여 정함을 원칙으로 한다.'에서 빈칸에 들어갈 단어를 쓰시오.", answer: "합리성", explanation: "표준 발음의 3대 원칙은 ① 표준어의 실제 발음, ② 국어의 전통성, ③ 합리성입니다." },
      { id: 3, type: "choice", question: "다음 중 표준 발음의 원칙에 대한 설명으로 알맞은 것을 고르세요.", options: ["1. 현실 발음에서 모음의 장단(길이)이 구별되지 않으므로, 장단 구분 규정은 전통성을 고려해 마련되어 있다.", "2. 'ㅢ'는 항상 예외 없이 단하나의 발음인 [ㅢ]로만 발음해야 한다."], answer: "1. 현실 발음에서 모음의 장단(길이)이 구별되지 않으므로, 장단 구분 규정은 전통성을 고려해 마련되어 있다.", explanation: "현실 발음에서 모음의 장단이 잘 구별되지 않더라도 오랜 기간 뜻을 변별해 온 역사성을 고려하여 '전통성' 측면에서 장단 규정을 두고 있습니다." },
      { id: 101, type: "choice", question: "자음을 첫소리로 가지고 있는 음절의 'ㅢ'는 어떻게 발음하는 것이 원칙인가요? (희망, 무늬)", options: ["1. [ㅢ]로만 발음해야 한다.", "2. [ㅣ]로 발음한다."], answer: "2. [ㅣ]로 발음한다.", explanation: "자음을 첫소리로 가지고 있는 음절의 'ㅢ'는 [ㅣ]로 발음합니다. (희망[히망], 무늬[무니])" },
      { id: 102, type: "choice", question: "단어의 첫음절 이외의 'ㅢ' 발음 규정으로 올바른 것은? (주의, 협의)", options: ["1. 원칙적으로 [ㅢ]로 발음하되, [ㅣ]로 발음함도 허용한다.", "2. 원칙적으로 [ㅣ]로 발음하되, [ㅢ]로 발음함도 허용한다."], answer: "1. 원칙적으로 [ㅢ]로 발음하되, [ㅣ]로 발음함도 허용한다.", explanation: "첫음절 이외의 'ㅢ'는 원칙적으로 [ㅢ]로 발음하지만 현실 발음을 고려하여 [ㅣ]로 발음하는 것도 허용합니다. (주의[주의/주이])" },
      { id: 103, type: "choice", question: "조사 '의'의 발음 규정으로 올바른 것은? (예: 우리의)", options: ["1. 원칙적으로 [ㅢ]로 발음하되, [ㅔ]로 발음함도 허용한다.", "2. 원칙적으로 [ㅔ]로 발음하되, [ㅢ]로 발음함도 허용한다."], answer: "1. 원칙적으로 [ㅢ]로 발음하되, [ㅔ]로 발음함도 허용한다.", explanation: "조사 '의'는 원칙적으로 [ㅢ]로 발음하되, [ㅔ]로 발음하는 것도 허용합니다. (예: 우리의[우리의/우리에])" }
    ],
    "2. 홑받침과 쌍받침의 발음": [
      { id: 4, type: "short", question: "어말이나 자음 앞에서 'ㅅ, ㅆ, ㅈ, ㅊ, ㅌ, ㅎ' 받침이 바뀐 대표음 한 글자를 쓰시오.", answer: "ㄷ", explanation: "음절의 끝소리 규칙에 따라 ㅅ, ㅆ, ㅈ, ㅊ, ㅌ, ㅎ은 모두 대표음 [ㄷ]으로 바뀌어 발음됩니다." },
      { id: 5, type: "choice", question: "홑받침이나 쌍받침 뒤에 '모음으로 시작하는 형식 형태소(조사, 어미, 접사)'가 연결될 때의 발음 원칙은?", options: ["1. 대표음으로 바꾼 뒤 뒤 음절 첫소리로 옮겨 발음한다.", "2. 대표음으로 바꾸지 않고 제 음가대로 뒤 음절 첫소리로 옮겨 발음한다."], answer: "2. 대표음으로 바꾸지 않고 제 음가대로 뒤 음절 첫소리로 옮겨 발음한다.", explanation: "형식 형태소가 올 때는 음절의 끝소리 규칙을 적용하지 않고 받침 제 음가대로 넘겨 발음(연음)합니다." },
      { id: 6, type: "short", question: "홑받침이나 쌍받침 뒤에 '모음으로 시작하는 실질 형태소'가 올 때는 받침을 [        ]으로 바꾸어서 뒤 음절의 첫소리로 옮겨 발음합니다. 빈칸에 들어갈 알맞은 단어를 쓰시오.", answer: "대표음", explanation: "뜻을 가진 실질 형태소가 뒤에 오면, 먼저 받침을 7개 대표음(ㄱ,ㄴ,ㄷ,ㄹ,ㅁ,ㅂ,ㅇ) 중 하나로 바꾼 뒤에 연음시킵니다." },
      { id: 104, type: "short", question: "단어 '낮', '낯', '낱'의 실제 발음을 순서대로 적으시오.", answer: ["낟,낟,낟", "낟, 낟, 낟", "낟낟낟", "[낟],[낟],[낟]", "[낟], [낟], [낟]"], explanation: "'낮', '낯', '낱'은 모두 어말에서 음절의 끝소리 규칙이 적용되어 대표음 [ㄷ]으로 동일하게 발음됩니다. [낟], [낟], [낟]" },
      { id: 7, type: "choice", question: "그 사람은 얼굴에서 빛이 [ 1. 비시 / 2. 비치 ] 난다.", options: ["1. 비시", "2. 비치"], answer: "2. 비치", explanation: "'이'는 모음으로 시작하는 형식 형태소(조사)이므로, 'ㅊ' 받침을 대표음으로 바꾸지 않고 제 음가대로 연음하여 [비치]로 발음합니다." },
      { id: 8, type: "choice", question: "등산을 했더니 무릎이 [ 1. 무르비 / 2. 무르피 ] 아프다.", options: ["1. 무르비", "2. 무르피"], answer: "2. 무르피", explanation: "'이'는 조사(형식 형태소)이므로 'ㅍ' 받침이 제 음가대로 연음되어 [무르피]가 됩니다." },
      { id: 9, type: "choice", question: "이 소설의 끝을 [ 1. 끄슬 / 2. 끄츨 / 3. 끄틀 ] 다시 써 보려 해.", options: ["1. 끄슬", "2. 끄츨", "3. 끄틀"], answer: "3. 끄틀", explanation: "'을'은 조사(형식 형태소)이므로 'ㅌ' 받침을 그대로 연음하여 [끄틀]로 발음합니다." },
      { id: 10, type: "choice", question: "꽃 아래 [ 1. 꼬다래 / 2. 꼬사래 / 3. 꼬차래 ] 그늘이 있다.", options: ["1. 꼬다래", "2. 꼬사래", "3. 꼬차래"], answer: "1. 꼬다래", explanation: "'아래'는 뜻을 가진 실질 형태소입니다. 따라서 '꽃'의 'ㅊ'을 먼저 대표음 [ㄷ]으로 바꾸고 연음시켜 [꼬다래]로 발음합니다." },
      { id: 105, type: "choice", question: "'맛있다'의 표준 발음으로 올바른 설명을 고르세요.", options: ["1. 실질 형태소 '있다'가 결합하므로 원칙 발음 [마디따]와 현실 발음을 고려한 [마시따] 둘 다 표준 발음이다.", "2. 형식 형태소가 결합한 것이므로 [마시따]만 표준 발음으로 인정된다."], answer: "1. 실질 형태소 '있다'가 결합하므로 원칙 발음 [마디따]와 현실 발음을 고려한 [마시따] 둘 다 표준 발음이다.", explanation: "'있다'는 실질 형태소이므로 대표음 [ㄷ]으로 바꾼 [마디따]가 원칙이나, 현실 발음에서 많이 쓰는 [마시따]도 표준 발음으로 함께 허용합니다." },
      { id: 11, type: "choice", question: "나는 빵을 매우 좋아한다 [ 1. 조아한다 / 2. 조하한다 ].", options: ["1. 조아한다", "2. 조하한다"], answer: "1. 조아한다", explanation: "받침 'ㅎ' 뒤에 모음으로 시작하는 형식 형태소가 오면 'ㅎ'은 발음되지 않고 탈락하므로 [조아한다]가 맞습니다." }
    ],
    "3. 겹받침의 발음": [
      { id: 12, type: "short", question: "음절 끝에 두 개의 자음이 놓일 때, 둘 중 하나의 자음만 남고 나머지 자음은 탈락하는 음운 현상의 명칭을 쓰시오.", answer: ["자음군 단순화", "자음군단순화"], explanation: "겹받침이 어말이나 자음 앞에서 하나만 발음되고 하나는 탈락하는 현상을 '자음군 단순화'라고 합니다." },
      { id: 112, type: "short", question: "우리 국어 선생님은 늘 시조를 한 수 읊고 시작하십니다. '읊고'의 올바른 표준 발음을 쓰시오.", answer: "읍꼬", explanation: "겹받침 'ㄿ'은 어말이나 자음 앞에서 대표음 [ㅂ]으로 발음되므로 '읊고'는 [읍꼬]가 맞습니다. (예: 읊다[읍따], 읊고[읍꼬])" },
      { id: 106, type: "short", question: "'닭이'의 올바른 표준 발음을 쓰시오.", answer: "달기", explanation: "모음으로 시작하는 형식 형태소(조사 '이')가 오면 겹받침 'ㄺ' 중 첫째 받침 [ㄹ]은 남고 둘째 받침 [ㄱ]이 넘어가 [달기]로 발음합니다." },
      { id: 107, type: "short", question: "'외곬'의 올바른 표준 발음을 쓰시오.", answer: "외골", explanation: "겹받침 'ㄽ'은 어말이나 자음 앞에서 'ㅅ'이 탈락하고 [ㄹ]로 발음되므로 [외골]이 맞습니다." },
      { id: 108, type: "short", question: "'읽다'와 '읽고'의 올바른 표준 발음을 순서대로 적으시오.", answer: ["익따, 일꼬", "익따,일꼬", "'익따', '일꼬'", "'익따','일꼬'"], explanation: "'읽다'의 겹받침 'ㄺ'은 자음 앞에서 [ㄱ]으로 발음되어 [익따]가 되고, '읽고'처럼 뒤에 'ㄱ'으로 시작하는 어미가 오면 [ㄹ]로 발음되어 [일꼬]가 됩니다." },
      { id: 109, type: "short", question: "'닳아'의 올바른 표준 발음을 쓰시오.", answer: "달아", explanation: "겹받침 'ㅀ' 뒤에 모음으로 시작하는 형식 형태소(어미 '-아')가 오면 'ㅎ'이 탈락하여 [달아]로 발음됩니다." },
      { id: 110, type: "short", question: "'값있는'의 올바른 표준 발음을 쓰시오.", answer: "가빈는", explanation: "실질 형태소 '있는' 앞에서 겹받침 'ㅄ'이 자음군 단순화로 대표음 [ㅂ]이 된 후, 뒤의 '있는'과 만나 음운 변동(비음화)을 거쳐 [가빈는]으로 발음됩니다." },
      { id: 111, type: "short", question: "'닭 앞에'의 올바른 표준 발음을 쓰시오. (띄어쓰기 없이 작성할 것)", answer: "다가페", explanation: "실질 형태소 '앞'이 올 때는 겹받침 'ㄺ'이 자음군 단순화로 대표음 [ㄱ]이 되어 연음[다가]되고, 조사 '에' 앞에서 'ㅍ'이 연음되어 최종 발음은 [다가페]가 됩니다." },
      { id: 13, type: "choice", question: "이 선을 밟지 [ 1. 발찌 / 2. 밥찌 ] 마라.", options: ["1. 발찌", "2. 밥찌"], answer: "2. 밥찌", explanation: "겹받침 'ㄼ'은 대부분 [ㄹ]로 발음되지만, 동사 '밟-'은 자음 앞에서 예외적으로 [밥-]으로 발음하므로 [밥찌]가 맞습니다." },
      { id: 14, type: "choice", question: "강당은 교실보다 넓다 [ 1. 넙따 / 2. 널따 ].", options: ["1. 넙따", "2. 널따"], answer: "2. 널따", explanation: "겹받침 'ㄼ'의 원칙적인 발음은 [ㄹ]이므로 [널따]가 맞습니다." },
      { id: 15, type: "choice", question: "오늘은 날씨가 어제보다 맑다 [ 1. 막따 / 2. 말따 ].", options: ["1. 막따", "2. 말따"], answer: "1. 막따", explanation: "겹받침 'ㄺ'은 어말이나 자음 앞에서 대표음 [ㄱ]으로 발음하므로 [막따]가 맞습니다." },
      { id: 16, type: "choice", question: "밥값은 [ 1. 밥깝쓴 / 2. 밥까븐 ] 누가 내는 거냐?", options: ["1. 밥깝쓴", "2. 밥까븐"], answer: "1. 밥깝쓴", explanation: "'은'은 조사(형식 형태소)입니다. 겹받침 'ㅄ'에서 첫째 받침 'ㅂ'은 남고, 둘째 받침 'ㅅ'이 연음되어 된소리 [ㅆ]으로 발음되므로 [밥깝쓴]이 맞습니다." },
      { id: 17, type: "choice", question: "흙 위에 [ 1. 흘귀에 / 2. 흐귀에 ] 쏟아졌다.", options: ["1. 흘귀에", "2. 흐귀에"], answer: "2. 흐귀에", explanation: "'위'는 실질 형태소이므로 겹받침 'ㄺ'에서 자음군 단순화가 일어나 대표음 [ㄱ]이 남고, 이것이 연음되어 [흐귀에]가 됩니다." },
      { id: 18, type: "choice", question: "하늘에 구름이 많아서 [ 1. 마나서 / 2. 만하서 ] 달을 못 보았다.", options: ["1. 마나서", "2. 만하서"], answer: "1. 마나서", explanation: "겹받침 'ㄶ' 뒤에 모음으로 시작하는 어미 '-아서'가 오면 'ㅎ'이 탈락하고 'ㄴ'만 넘어가 [마나서]로 발음됩니다." }
    ]
  };

  // 애플리케이션 상태
  let studentId = "";
  let studentName = "";
  let activeQuizList = [];
  let currentIndex = 0;
  let firstAttemptStatus = {}; // { qId: true/false }
  let wrongQuestions = [];
  let sheetSubmitted = false;

  // 공백 및 기호 정규화 함수
  function cleanText(text) {
    if (Array.isArray(text)) return text.map(t => cleanText(t));
    return text.toString().replace(/\s+/g, "").replace(/\[|\]/g, "").replace(/\./g, ",").replace(/\//g, ",");
  }

  function shuffle(array) {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function initQuizData() {
    let list = [];
    for (const [category, items] of Object.entries(RAW_QUIZ_DATA)) {
      const shuffledCat = shuffle(items);
      shuffledCat.forEach(item => {
        list.push({ ...item, category: category });
      });
    }
    activeQuizList = list;
    currentIndex = 0;
    firstAttemptStatus = {};
    wrongQuestions = [];
    sheetSubmitted = false;
  }

  // 1. 시작 화면
  function startQuiz() {
    const idVal = document.getElementById("s_id").value.trim();
    const nameVal = document.getElementById("s_name").value.trim();

    if (!idVal || !nameVal) {
      document.getElementById("intro-warn").classList.remove("hidden");
      return;
    }
    studentId = idVal;
    studentName = nameVal;

    initQuizData();
    document.getElementById("screen-intro").classList.add("hidden");
    document.getElementById("screen-quiz").classList.remove("hidden");
    renderCurrentQuestion();
  }

  // 2. 문제 렌더링
  function renderCurrentQuestion() {
    const q = activeQuizList[currentIndex];
    const total = activeQuizList.length;

    // 헤더 상태
    document.getElementById("display-user").innerHTML = `👤 <b>학생:</b> ${studentName} (${studentId})`;
    document.getElementById("display-progress").innerHTML = `🎯 <b>진행:</b> ${currentIndex + 1} / ${total} 문항`;
    document.getElementById("progress-bar").style.width = `${((currentIndex + 1) / total) * 100}%`;

    // 1번 문항일 때 교사 점프 박스 노출
    const teacherBox = document.getElementById("teacher-quick-pass");
    if (currentIndex === 0) {
      teacherBox.classList.remove("hidden");
    } else {
      teacherBox.classList.add("hidden");
    }

    // 본문 내용
    document.getElementById("q-category").innerText = `📌 ${q.category}`;
    document.getElementById("q-question").innerText = `Q${currentIndex + 1}. ${q.question}`;

    // 초기화
    document.getElementById("btn-check").classList.remove("hidden");
    document.getElementById("feedback-result").classList.add("hidden");
    document.getElementById("lock-msg").classList.add("hidden");

    const boxShort = document.getElementById("box-short");
    const boxChoice = document.getElementById("box-choice");
    const shortInput = document.getElementById("short-input");

    if (q.type === "short") {
      boxShort.classList.remove("hidden");
      boxChoice.classList.add("hidden");
      shortInput.value = "";
      shortInput.disabled = false;
      setTimeout(() => shortInput.focus(), 50);
    } else {
      boxShort.classList.add("hidden");
      boxChoice.classList.remove("hidden");
      const optContainer = document.getElementById("choice-options");
      optContainer.innerHTML = "";
      q.options.forEach((opt, idx) => {
        const item = document.createElement("label");
        item.className = "radio-item";
        item.innerHTML = `
          <input type="radio" name="quiz_opt" value="${opt}" id="opt_${idx}">
          <span>${opt}</span>
        `;
        optContainer.appendChild(item);
      });
    }
  }

  function handleEnter(e) {
    if (e.key === "Enter") checkCurrentAnswer();
  }

  // 3. 정답 검증 로직
  function checkCurrentAnswer() {
    const q = activeQuizList[currentIndex];
    let userAns = "";

    if (q.type === "short") {
      userAns = document.getElementById("short-input").value.trim();
    } else {
      const selected = document.querySelector('input[name="quiz_opt"]:checked');
      if (selected) userAns = selected.value;
    }

    if (!userAns) {
      alert("⚠️ 먼저 정답을 입력하거나 선택해 주세요.");
      return;
    }

    let isCorrect = false;
    if (q.type === "short") {
      const cleanedUser = cleanText(userAns);
      const cleanedCorrect = cleanText(q.answer);
      if (Array.isArray(cleanedCorrect)) {
        isCorrect = cleanedCorrect.includes(cleanedUser);
      } else {
        isCorrect = (cleanedUser === cleanedCorrect);
      }
    } else {
      isCorrect = (userAns === q.answer);
    }

    // 첫 시도 여부 저장
    if (firstAttemptStatus[q.id] === undefined) {
      firstAttemptStatus[q.id] = isCorrect;
    }

    // 피드백 UI 표시
    document.getElementById("feedback-result").classList.remove("hidden");
    const msgBox = document.getElementById("msg-feedback");
    const expBox = document.getElementById("msg-explanation");
    const btnNext = document.getElementById("btn-next");
    const lockMsg = document.getElementById("lock-msg");

    expBox.innerHTML = `💡 <b>교과서 원리 해설:</b><br>${q.explanation}`;

    if (isCorrect) {
      msgBox.className = "msg-box msg-success";
      msgBox.innerHTML = "🎉 <b>정답입니다! 통과하셨습니다.</b>";
      btnNext.classList.remove("hidden");
      lockMsg.classList.add("hidden");
      document.getElementById("btn-check").classList.add("hidden");
      if (q.type === "short") document.getElementById("short-input").disabled = true;
      btnNext.focus();
    } else {
      msgBox.className = "msg-box msg-error";
      msgBox.innerHTML = `❌ <b>오답입니다. 해설을 확인하고 정답을 맞춰 다음으로 이동하세요.</b> (내가 낸 답: ${userAns})`;
      btnNext.classList.add("hidden");
      lockMsg.classList.remove("hidden");
    }
  }

  // 다음 문제 또는 종료
  function goToNextQuestion() {
    if (currentIndex < activeQuizList.length - 1) {
      currentIndex++;
      renderCurrentQuestion();
    } else {
      finishQuiz();
    }
  }

  // 교사 직행 기능
  function checkTeacherJump() {
    const pw = document.getElementById("teacher-pw").value.trim();
    if (pw === TEACHER_PASSWORD) {
      finishQuiz();
    } else {
      alert("비밀번호가 일치하지 않습니다.");
    }
  }

  // 4. 최종 결과 및 비동기 전송
  function finishQuiz() {
    document.getElementById("screen-quiz").classList.add("hidden");
    document.getElementById("screen-result").classList.remove("hidden");

    // 오답 리스트 집계
    wrongQuestions = activeQuizList.filter(q => firstAttemptStatus[q.id] === false);
    const totalCount = activeQuizList.length;
    const correctCount = totalCount - wrongQuestions.length;
    const wrongIdsStr = wrongQuestions.length > 0 ? wrongQuestions.map(q => q.id).join(", ") : "없음";

    document.getElementById("result-title").innerText = `🎉 ${studentName || "선생님"} 님, 평가 완료!`;
    document.getElementById("result-score").innerText = `첫 시도 정답: ${totalCount}문항 중 ${correctCount}개`;

    // 🚀 구글 시트 백그라운드 전송 (화면 멈춤 전혀 없음)
    if (studentId && !sheetSubmitted && GOOGLE_SHEET_WEBAPP_URL.startsWith("https://script.google.com")) {
      sheetSubmitted = true;
      const payload = {
        student_id: studentId,
        student_name: studentName,
        score: correctCount,
        total: totalCount,
        wrong_questions: wrongIdsStr
      };

      fetch(GOOGLE_SHEET_WEBAPP_URL, {
        method: "POST",
        mode: "no-cors", // 브라우저 CORS 차단 완전 우회
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      }).catch(() => {});
    }

    renderResultTabs(correctCount, totalCount);
  }

  function renderResultTabs(correctCount, totalCount) {
    const wrongBox = document.getElementById("wrong-summary-box");
    const retryBtn = document.getElementById("btn-retry-wrong");

    if (wrongQuestions.length > 0) {
      wrongBox.innerHTML = `
        <h4 style="color: var(--error); margin-bottom: 8px;">⚠️ 처음 시도에서 틀렸던 문제가 <b>${wrongQuestions.length}개</b> 있습니다.</h4>
        <p style="font-size: 0.92rem; color: var(--text);">오답 문항 번호: <b>${wrongQuestions.map((q, idx) => `Q${q.id}`).join(", ")}</b></p>
      `;
      retryBtn.classList.remove("hidden");
    } else {
      wrongBox.innerHTML = `<h4 style="color: var(--success);">💯 첫 번째 시도에서 모든 문제를 완벽하게 맞혔습니다!</h4>`;
      retryBtn.classList.add("hidden");
    }

    // 30문항 전체 복습 리스트 렌더링
    const allList = document.getElementById("all-questions-list");
    allList.innerHTML = "";
    let qNum = 1;
    for (const [cat, items] of Object.entries(RAW_QUIZ_DATA)) {
      items.forEach(q => {
        const itemDiv = document.createElement("div");
        itemDiv.style.marginBottom = "14px";
        const ansText = Array.isArray(q.answer) ? q.answer[0] : q.answer;
        itemDiv.innerHTML = `
          <p style="font-size: 0.95rem; margin-bottom: 6px;"><b>[${cat}] ${qNum}. ${q.question}</b></p>
          <details>
            <summary>Q${qNum} 정답 및 해설 확인</summary>
            <div style="margin-top: 8px; font-size: 0.9rem;">
              <p><b>정답:</b> <code style="background:#F1F5F9; padding:2px 6px; border-radius:4px;">${ansText}</code></p>
              <p style="margin-top: 4px; color: #166534;"><b>💡 해설:</b> ${q.explanation}</p>
            </div>
          </details>
          <hr style="border:0; border-top: 1px solid #E2E8F0; margin-top: 10px;">
        `;
        allList.appendChild(itemDiv);
        qNum++;
      });
    }
  }

  function startRetryWrong() {
    activeQuizList = [...wrongQuestions];
    currentIndex = 0;
    firstAttemptStatus = {};
    document.getElementById("screen-result").classList.add("hidden");
    document.getElementById("screen-quiz").classList.remove("hidden");
    renderCurrentQuestion();
  }

  function resetFullQuiz() {
    studentId = "";
    studentName = "";
    document.getElementById("s_id").value = "";
    document.getElementById("s_name").value = "";
    document.getElementById("screen-result").classList.add("hidden");
    document.getElementById("screen-intro").classList.remove("hidden");
  }

  function switchTab(idx) {
    const btns = document.querySelectorAll(".tab-btn");
    btns.forEach((b, i) => b.classList.toggle("active", i === idx - 1));
    document.getElementById("tab-content-1").classList.toggle("hidden", idx !== 1);
    document.getElementById("tab-content-2").classList.toggle("hidden", idx !== 2);
  }
</script>
</body>
